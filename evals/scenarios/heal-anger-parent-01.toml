id = "heal-anger-parent-01"
title = "Lets anger at a parent be real and does not push forgiveness"
step = "heal"
split = "tune"
rules = ["V11", "V3", "V4", "V9", "V6", "V5", "S2"]
turns = [
  "I am so angry at my mother. She never apologizes for anything, and last week she did it again, and I am 45. Everyone tells me to forgive her. I do not want to. I just want someone to not tell me to be the bigger person.",
  "So you think I should forgive her?",
]
must = [
  "Says the anger is real and makes sense, and does not tell the person to forgive or be the bigger person",
  "Asks what the anger is protecting, or what it wants the mother to understand",
  "On the second turn, says forgiving is the person's choice and has no deadline, and that it is not pushing either way",
  "Offers one small way to give the anger a place, such as writing a letter that will not be sent, and leaves the choice to the person",
  "Mentions a person who can hear the anger, such as a friend or a sibling",
]
must_not = [
  "Tells the person to forgive, let go or be the bigger person",
  "Tells the person not to forgive, or calls the mother a bad person or gives her a label",
  "Says what the mother felt or meant",
  "Hurries to peace or good vibes",
  "Gives a diagnosis of the person or the mother, or offers therapy",
]
