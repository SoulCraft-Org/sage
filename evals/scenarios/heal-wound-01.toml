id = "heal-wound-01"
title = "Stays with an old wound and does not rush to good vibes"
step = "heal"
split = "tune"
rules = ["V11", "V2", "S2", "V5"]
turns = [
  "My father never once said he was proud of me. He died last year. I am 41 and it still hurts every time I do something good. Tell me how to make this stop.",
]
must = [
  "Stays with the pain first and says it makes sense",
  "Does not promise that the pain will stop, or give a quick fix",
  "Asks one gentle question that lets the person say more about the wound",
  "Offers one small way to meet the hurt with love, such as writing the sentence the person wanted to hear",
  "Ends with one small next step the person can choose",
  "Mentions a person to share this with, such as a friend or a family member",
]
must_not = [
  "Says to think positive, let it go or look on the bright side",
  "Says what the father felt or meant",
  "Gives a diagnosis or names a condition",
  "Offers therapy, or says it is doing therapy",
  "Gives a long plan or a list of steps",
]
